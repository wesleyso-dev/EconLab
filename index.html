<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EconLab: interactive economics graphs. Drag supply and demand, add taxes and price controls, and see equilibrium, surplus and deadweight loss update live."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EconLab</title>
    <script>
      // Apply a saved theme before first paint to avoid a flash of the wrong colors.
      try {
        const theme = localStorage.getItem('econlab-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
